<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа — CactusShop</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body>

<header class="site-header">
    <div class="site-header__inner">
        <a class="site-header__logo" href="index.html">СactusShop</a>
        <nav class="site-nav" aria-label="Основная навигация">
            <ul class="site-nav__list">
                <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
                <li class="site-nav__item"><a class="site-nav__link" href="catalog.html">Каталог</a></li>
                <li class="site-nav__item"><a class="site-nav__link" href="contacts.html">Контакты</a></li>
                <li class="site-nav__item"><a class="site-nav__link" href="index.html#advantages">Преимущества</a></li>
                <li class="site-nav__item"><a class="site-nav__link" href="index.html#popular">Популярные товары</a></li>
                <li class="site-nav__item"><a class="site-nav__link" href="feedback.html">Обратная связь</a></li>
            </ul>
        </nav>
    </div>
</header>

<main>
    <div class="breadcrumbs">
        <a class="breadcrumbs__link" href="index.html">Главная</a> /
        <span class="breadcrumbs__current">Оформление заказа</span>
    </div>

    <section class="feedback-container">
        <h2>Оформление заявки</h2>

        <form class="order-form" id="page-order-form" action="#" method="post" novalidate>

            <div class="order-form__field">
                <label class="order-form__label" for="page-order-product">Выберите товар</label>
                <select class="order-form__select" id="page-order-product" name="selected-product" required>
                    <option value="" disabled selected>-- Выберите кактус --</option>
                    <option value="Ферокактус шварции">Ферокактус шварции (381 руб.)</option>
                    <option value="Хавортия маргаритифера">Хавортия маргаритифера (499 руб.)</option>
                    <option value="Эхеверия мун фейри">Эхеверия мун фейри (659 руб.)</option>
                </select>
            </div>

            <div class="order-form__field">
                <label class="order-form__label" for="page-order-name">Имя</label>
                <input class="order-form__input" id="page-order-name" name="name" type="text" placeholder="Введите ваше имя" minlength="2" required>
            </div>

            <div class="order-form__field">
                <label class="order-form__label" for="page-order-email">E-mail</label>
                <input class="order-form__input" id="page-order-email" name="email" type="email" placeholder="example@mail.ru" required>
            </div>

            <div class="order-form__field">
                <label class="order-form__label" for="page-order-phone">Телефон</label>
                <input class="order-form__input" id="page-order-phone" name="phone" type="tel" placeholder="+7 (900) 000-00-00" pattern="^\+7 \(\d{3}\) \d{3}-\d{2}-\d{2}$" required>
                <small style="display:block; margin-top:5px; color:var(--color-muted);">Формат: +7 (900) 000-00-00</small>
            </div>

            <div class="order-form__field">
                <label class="order-form__label" for="page-order-comment">Комментарий к заказу</label>
                <textarea class="order-form__input" id="page-order-comment" name="comment" rows="4" placeholder="Укажите адрес доставки или пожелания"></textarea>
            </div>

            <div class="order-form__field order-form__field--checkbox">
                <input id="page-order-agreement" name="agreement" type="checkbox" required>
                <label for="page-order-agreement">Я согласен на обработку данных</label>
            </div>

            <button class="button button--primary" type="submit" style="width: 100%;">Отправить заявку</button>
        </form>

        <!-- Сообщение об успехе с уникальным ID под ваш JS -->
        <p class="success-message" id="order-page-success-message" hidden>Форма успешно отправлена!</p>
    </section>
</main>

<footer>
    <p>&copy; 2026 Учебный проект. Все права защищены.</p>
    <p>Магазин комнатных растений и суккулентов</p>
</footer>
</body>
</html>
